name: Build and Release Windows Executable

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v1.0.0
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[cpu]
        pip install pyinstaller

    - name: Build Executable
      run: |
        python build_exe.py

    - name: Zip the Output
      run: |
        # Pyinstaller outputs a folder by default without --onefile
        Compress-Archive -Path dist\Spripe\* -DestinationPath dist\Spripe-Windows.zip

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/Spripe-Windows.zip
        generate_release_notes: true
