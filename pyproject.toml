[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spripe"
version = "1.0.0"
description = "A 2D sprite asset pipeline application."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyQt6>=6.4.0",
    "opencv-python>=4.7.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
cpu = ["rembg"]
gpu = ["rembg[gpu]"]
dev = ["mkdocs>=1.4.0", "mkdocs-material>=9.1.0"]

[project.scripts]
spripe = "spripe.cli:main"

[tool.setuptools]
packages = ["spripe", "spripe.core", "spripe.gui", "spripe.scripts"]

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",
    "too-many-public-methods",
    "too-many-branches",
    "too-many-arguments",
    "too-many-locals",
    "too-many-statements",
    "too-many-instance-attributes",
    "import-outside-toplevel",
    "broad-exception-caught",
    "no-name-in-module",
    "invalid-name",
    "duplicate-code",
    "attribute-defined-outside-init",
    "unused-import",
    "line-too-long",
    "wrong-import-position",
    "unnecessary-lambda",
    "redefined-outer-name",
    "reimported",
    "no-member",
    "useless-parent-delegation",
    "function-redefined",
    "unused-argument",
    "consider-using-max-builtin",
    "unused-variable",
    "wrong-import-order",
    "possibly-used-before-assignment",
    "f-string-without-interpolation",
    "too-many-lines"
]
